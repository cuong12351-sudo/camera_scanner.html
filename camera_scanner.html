
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>QR Production - Camera Scanner</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #edf2f7;
      color: #1f2937;
    }

    main {
      max-width: 520px;
      margin: 0 auto;
      padding: 18px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 18px #0001;
    }

    h2 {
      text-align: center;
      color: #124b80;
    }

    video {
      display: block;
      width: 100%;
      max-height: 60vh;
      background: #111827;
      border-radius: 10px;
      object-fit: contain;
    }

    button {
      width: 100%;
      min-height: 48px;
      margin-top: 12px;
      padding: 12px;
      border: 0;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background: #1261a0;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    #stopButton { background: #b91c1c; }
    #retryButton { background: #15803d; }

    #status {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      background: #dbeafe;
      color: #1e40af;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .error {
      background: #fee2e2 !important;
      color: #991b1b !important;
    }

    .ok {
      background: #dcfce7 !important;
      color: #166534 !important;
    }

    #qrResult {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #f8fafc;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
<main>
  <h2>QUÉT QR SẢN PHẨM</h2>

  <p>
    Nhấn BẬT CAMERA, cho phép truy cập camera nếu được hỏi,
    rồi đưa mã QR vào giữa khung hình.
  </p>

  <video id="video" autoplay muted playsinline></video>

  <div id="status" role="status" aria-live="polite">
    Nhấn BẬT CAMERA để bắt đầu.
  </div>

  <div id="qrResult"></div>

  <button id="startButton" type="button">BẬT CAMERA</button>
  <button id="retryButton" type="button" disabled>GỬI LẠI MÃ QR</button>
  <button id="stopButton" type="button">DỪNG CAMERA</button>
</main>

<canvas id="canvas" hidden></canvas>

<script>
(function () {
  'use strict';

  // Origin của trang Apps Script có thể thuộc một trong hai miền này.
  const ALLOWED_PARENT_ORIGINS = [
    'https://script.google.com',
    'https://script.googleusercontent.com'
  ];

  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const context = canvas.getContext('2d', {
    willReadFrequently: true
  });

  const statusBox = document.getElementById('status');
  const qrResult = document.getElementById('qrResult');
  const startButton = document.getElementById('startButton');
  const retryButton = document.getElementById('retryButton');
  const stopButton = document.getElementById('stopButton');

  let stream = null;
  let active = false;
  let starting = false;
  let found = false;
  let frameId = null;
  let lastScan = 0;
  let pendingQrText = '';
  let pendingAckTimeout = null;
  let acknowledged = false;
  let lastParentOrigin = '';

  function showStatus(message, type) {
    statusBox.textContent = message;
    statusBox.className = type || '';
  }

  function stopCamera() {
    active = false;

    if (frameId !== null) {
      cancelAnimationFrame(frameId);
      frameId = null;
    }

    if (stream) {
      stream.getTracks().forEach(function (track) {
        track.stop();
      });
      stream = null;
    }

    video.srcObject = null;
    starting = false;
  }

  function clearAckTimeout() {
    if (pendingAckTimeout !== null) {
      clearTimeout(pendingAckTimeout);
      pendingAckTimeout = null;
    }
  }

  function sendQrToParent() {
    if (!pendingQrText) {
      showStatus('Chưa có mã QR để gửi.', 'error');
      return;
    }

    if (!window.opener || window.opener.closed) {
      showStatus(
        'Đã đọc mã QR nhưng không tìm thấy biểu mẫu đang mở.\n' +
        'Hãy mở máy quét từ nút QUÉT QR BẰNG CAMERA trong QR PRODUCTION.',
        'error'
      );
      retryButton.disabled = false;
      return;
    }

    try {
      // Xóa bộ đếm thời gian chờ cũ trước khi gửi lại.
      clearAckTimeout();
      acknowledged = false;
      retryButton.disabled = true;

      window.opener.postMessage({
        type: 'QR_SCANNED',
        text: pendingQrText
      }, '*');

      showStatus(
        'Đã đọc mã QR. Đang chờ biểu mẫu xác nhận nhận mã...',
        ''
      );

      pendingAckTimeout = setTimeout(function () {
        if (acknowledged) return;

        retryButton.disabled = false;

        showStatus(
          'Chưa nhận được xác nhận từ biểu mẫu.\n' +
          'Mã QR vẫn được giữ lại:\n' + pendingQrText +
          '\n\nHãy kiểm tra cửa sổ QR PRODUCTION. ' +
          'Nếu ô sản phẩm chưa có mã, hãy nhấn GỬI LẠI MÃ QR.',
          'error'
        );
      }, 8000);

    } catch (err) {
      clearAckTimeout();
      retryButton.disabled = false;

      showStatus(
        'Không gửi được mã QR: ' + err.message,
        'error'
      );
    }
  }

  async function startCamera() {
    if (starting || active || found) return;

    starting = true;

    if (!window.isSecureContext ||
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      starting = false;
      showStatus(
        'Camera không khả dụng. Hãy mở trang bằng HTTPS ' +
        'và dùng trình duyệt hỗ trợ camera.',
        'error'
      );
      return;
    }

    if (typeof window.jsQR !== 'function') {
      starting = false;
      showStatus(
        'Không tải được thư viện QR. Kiểm tra Internet rồi tải lại trang.',
        'error'
      );
      return;
    }

    showStatus('Đang yêu cầu quyền camera...', '');

    try {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });
      } catch (firstError) {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: true
        });
      }

      video.srcObject = stream;
      await video.play();

      active = true;
      starting = false;
      found = false;
      lastScan = 0;

      showStatus(
        'Camera đã bật. Đưa mã QR vào khung hình.',
        ''
      );

      frameId = requestAnimationFrame(scanFrame);

    } catch (err) {
      stopCamera();
      console.error('Camera error:', err.name, err.message);

      let message = 'Không thể mở camera.';

      if (err.name === 'NotAllowedError' ||
          err.name === 'SecurityError') {
        message =
          'Quyền camera đang bị từ chối. Hãy kiểm tra quyền camera ' +
          'của trình duyệt và quyền riêng tư trên thiết bị.';
      } else if (err.name === 'NotFoundError') {
        message = 'Không tìm thấy camera trên thiết bị.';
      } else if (err.name === 'NotReadableError') {
        message =
          'Camera đang bận hoặc không thể khởi động. ' +
          'Hãy đóng ứng dụng khác đang sử dụng camera.';
      } else {
        message += '\nChi tiết: ' + err.message;
      }

      showStatus(message, 'error');
    }
  }

  function scanFrame() {
    if (!active || found) return;

    if (
      video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA &&
      video.videoWidth > 0 &&
      video.videoHeight > 0 &&
      Date.now() - lastScan >= 150
    ) {
      lastScan = Date.now();

      const scale = Math.min(
        1,
        1000 / Math.max(video.videoWidth, video.videoHeight)
      );

      canvas.width = Math.max(
        1,
        Math.round(video.videoWidth * scale)
      );

      canvas.height = Math.max(
        1,
        Math.round(video.videoHeight * scale)
      );

      context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );

      try {
        const pixels = context.getImageData(
          0,
          0,
          canvas.width,
          canvas.height
        );

        const result = window.jsQR(
          pixels.data,
          pixels.width,
          pixels.height,
          { inversionAttempts: 'attemptBoth' }
        );

        if (result && result.data && result.data.trim()) {
          pendingQrText = result.data.trim();
          found = true;

          stopCamera();

          qrResult.style.display = 'block';
          qrResult.textContent = 'Mã QR đã đọc:\n' + pendingQrText;

          sendQrToParent();
          return;
        }
      } catch (err) {
        console.error('QR scan error:', err);
      }
    }

    if (active) {
      frameId = requestAnimationFrame(scanFrame);
    }
  }

  /*
   * Chỉ đóng cửa sổ khi biểu mẫu gửi xác nhận QR_RECEIVED
   * với đúng mã vừa quét và đúng cửa sổ cha.
   */
  window.addEventListener('message', function (event) {
    if (!ALLOWED_PARENT_ORIGINS.includes(event.origin)) return;
    if (!window.opener || event.source !== window.opener) return;

    const data = event.data;

    if (!data ||
        data.type !== 'QR_RECEIVED' ||
        typeof data.text !== 'string') {
      return;
    }

    if (!pendingQrText || data.text !== pendingQrText) {
      return;
    }

    acknowledged = true;
    lastParentOrigin = event.origin;
    clearAckTimeout();

    retryButton.disabled = true;

    showStatus(
      'Biểu mẫu đã xác nhận nhận mã QR thành công.\n' +
      'Đang đóng cửa sổ máy quét...',
      'ok'
    );

    setTimeout(function () {
      window.close();

      // Nếu trình duyệt không cho tự đóng, hiển thị hướng dẫn.
      setTimeout(function () {
        if (!window.closed) {
          showStatus(
            'Đã gửi mã thành công. Trình duyệt không cho phép ' +
            'tự đóng cửa sổ; bạn có thể đóng cửa sổ này.',
            'ok'
          );
        }
      }, 300);
    }, 500);
  });

  startButton.addEventListener('click', startCamera);

  retryButton.addEventListener('click', function () {
    if (acknowledged) return;
    sendQrToParent();
  });

  stopButton.addEventListener('click', function () {
    stopCamera();
    showStatus(
      pendingQrText
        ? 'Camera đã dừng. Mã QR đã đọc vẫn được giữ lại.'
        : 'Camera đã dừng. Bạn có thể nhấn BẬT CAMERA để quét lại.',
      ''
    );
  });

  window.addEventListener('pagehide', function () {
    stopCamera();
    clearAckTimeout();
  });
})();
</script>
</body>
</html>
