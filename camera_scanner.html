
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Quét QR trực tiếp</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px;
      font-family: Arial, sans-serif;
      background: #edf2f7; color: #1f2937;
    }
    main {
      max-width: 520px; margin: 0 auto;
      background: #fff; padding: 18px;
      border-radius: 14px; box-shadow: 0 4px 18px #0001;
    }
    h2 { color: #124b80; text-align: center; font-size: 22px; }
    p { font-size: 14px; line-height: 1.5; }
    video {
      width: 100%; max-height: 65vh;
      background: #111827; border-radius: 10px;
      display: block; object-fit: cover;
    }
    button {
      width: 100%; min-height: 48px;
      border: 0; border-radius: 9px;
      margin-top: 12px; font-size: 16px;
      font-weight: bold; background: #b91c1c; color: white;
    }
    #status {
      margin-top: 12px; padding: 12px;
      border-radius: 8px; background: #dbeafe;
      color: #1e40af; white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .error { background: #fee2e2 !important; color: #991b1b !important; }
    .ok { background: #dcfce7 !important; color: #166534 !important; }
  </style>
</head>
<body>
<main>
  <h2>QUÉT QR TRỰC TIẾP</h2>
  <p>
    Cho phép sử dụng camera khi trình duyệt hỏi.
    Đưa mã QR vào khung hình. Sau khi biểu mẫu xác nhận,
    cửa sổ quét sẽ tự đóng.
  </p>
  <video id="video" autoplay muted playsinline></video>
  <div id="status" role="status" aria-live="polite">
    Đang khởi động camera...
  </div>
  <button id="stopButton" type="button">
    DỪNG CAMERA / ĐÓNG CỬA SỔ
  </button>
</main>
<canvas id="canvas" hidden></canvas>

<script>
(function () {
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const statusBox = document.getElementById('status');
  const stopButton = document.getElementById('stopButton');

  let stream = null;
  let active = false;
  let frameId = null;
  let lastScan = 0;
  let waitingReply = false;
  let replyTimer = null;

  function status(text, kind) {
    statusBox.textContent = text;
    statusBox.className = kind || '';
  }

  function stopCamera() {
    active = false;

    if (frameId !== null) {
      cancelAnimationFrame(frameId);
      frameId = null;
    }

    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }

    video.srcObject = null;
  }

  function closeScanner() {
    stopCamera();
    if (window.opener && !window.opener.closed) {
      window.close();
    }
  }

  stopButton.addEventListener('click', closeScanner);

  window.addEventListener('pagehide', stopCamera);

  // Chỉ chấp nhận phản hồi từ đúng cửa sổ biểu mẫu đã mở camera.
  window.addEventListener('message', function (event) {
    if (!window.opener || event.source !== window.opener) return;

    const data = event.data;
    if (!data || typeof data !== 'object') return;

    if (data.type === 'QR_RECEIVED' && waitingReply) {
      waitingReply = false;
      clearTimeout(replyTimer);
      status('Biểu mẫu đã nhận mã QR thành công.', 'ok');
      setTimeout(closeScanner, 400);
      return;
    }

    if (data.type === 'QR_REJECTED' && waitingReply) {
      waitingReply = false;
      clearTimeout(replyTimer);

      const message = data.message || 'Biểu mẫu từ chối mã QR. Hãy quét lại.';
      status(message, 'error');

      // Cho phép quét lại mã hợp lệ.
      setTimeout(function () {
        if (!window.opener || window.opener.closed) {
          status('Biểu mẫu đã đóng. Hãy mở lại QR_PRODUCTION.', 'error');
          return;
        }
        start();
      }, 1200);
    }
  });

  async function start() {
    if (active || waitingReply) return;

    if (!window.opener || window.opener.closed) {
      status(
        'Không tìm thấy biểu mẫu đã mở cửa sổ này. Hãy mở QR_PRODUCTION và bấm nút quét QR tại đó.',
        'error'
      );
      return;
    }

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      status('Trình duyệt không hỗ trợ camera hoặc trang chưa chạy bằng HTTPS.', 'error');
      return;
    }

    if (typeof window.jsQR !== 'function') {
      status('Không tải được thư viện đọc QR. Hãy kiểm tra Internet rồi tải lại trang.', 'error');
      return;
    }

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      });

      video.srcObject = stream;
      await video.play();
      active = true;

      status('Camera đã bật. Đưa mã QR vào khung hình.');
      frameId = requestAnimationFrame(scan);
    } catch (err) {
      let msg = 'Không mở được camera.';

      if (err && err.name === 'NotAllowedError') {
        msg = 'Quyền camera bị từ chối. Hãy cho phép camera trong trình duyệt rồi tải lại.';
      } else if (err && err.name === 'NotFoundError') {
        msg = 'Không tìm thấy camera trên thiết bị.';
      } else if (err && err.name === 'NotReadableError') {
        msg = 'Camera đang được ứng dụng khác sử dụng. Hãy đóng ứng dụng đó rồi thử lại.';
      } else if (err && err.message) {
        msg += ' ' + err.message;
      }

      stopCamera();
      status(msg, 'error');
    }
  }

  function scan() {
    if (!active) return;

    if (
      video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA &&
      video.videoWidth > 0 &&
      video.videoHeight > 0 &&
      Date.now() - lastScan > 120
    ) {
      lastScan = Date.now();

      const scale = Math.min(
        1,
        1000 / Math.max(video.videoWidth, video.videoHeight)
      );

      canvas.width = Math.max(1, Math.round(video.videoWidth * scale));
      canvas.height = Math.max(1, Math.round(video.videoHeight * scale));

      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      try {
        const image = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = window.jsQR(
          image.data,
          image.width,
          image.height,
          { inversionAttempts: 'attemptBoth' }
        );

        if (code && code.data && String(code.data).trim()) {
          const rawText = String(code.data).trim();

          // Dừng camera trong khi chờ biểu mẫu xác nhận.
          stopCamera();
          waitingReply = true;

          status('Đã đọc QR. Đang chờ biểu mẫu xác nhận nhận mã...', '');

          try {
            // '*' dùng vì URL Web App có thể chuyển hướng sang
            // một origin Google khác. Biểu mẫu phải kiểm tra
            // event.origin và event.source trước khi chấp nhận.
            window.opener.postMessage({
              type: 'QR_SCANNED',
              text: rawText
            }, '*');
          } catch (err) {
            waitingReply = false;
            status('Không gửi được mã: ' + err.message, 'error');
            return;
          }

          // Không tự đóng cửa sổ nếu chưa nhận phản hồi.
          replyTimer = setTimeout(function () {
            if (!waitingReply) return;
            waitingReply = false;

            status(
              'Chưa nhận được phản hồi từ biểu mẫu. Hãy kiểm tra Index.html có gửi QR_RECEIVED hoặc QR_REJECTED về cửa sổ quét hay không.',
              'error'
            );
          }, 5000);

          return;
        }
      } catch (err) {
        // Bỏ qua khung hình chưa đọc được.
      }
    }

    frameId = requestAnimationFrame(scan);
  }

  start();
})();
</script>
</body>
</html>
