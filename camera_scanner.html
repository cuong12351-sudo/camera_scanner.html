<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Quét QR trực tiếp</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    *{box-sizing:border-box} body{margin:0;padding:16px;font-family:Arial,sans-serif;background:#edf2f7;color:#1f2937}
    main{max-width:520px;margin:0 auto;background:#fff;padding:18px;border-radius:14px;box-shadow:0 4px 18px #0001}
    h2{margin:0 0 8px;color:#124b80;text-align:center;font-size:22px} p{font-size:14px;line-height:1.5}
    video{width:100%;max-height:65vh;background:#111827;border-radius:10px;display:block;object-fit:cover}
    button{width:100%;min-height:48px;border:0;border-radius:9px;margin-top:12px;font-size:16px;font-weight:bold;background:#b91c1c;color:white}
    #status{padding:12px;border-radius:8px;background:#dbeafe;color:#1e40af;white-space:pre-wrap;overflow-wrap:anywhere}
    .error{background:#fee2e2!important;color:#991b1b!important}.ok{background:#dcfce7!important;color:#166534!important}
  </style>
</head>
<body>
<main>
  <h2>QUÉT QR TRỰC TIẾP</h2>
  <p>Cho phép sử dụng camera khi trình duyệt hỏi. Đưa mã QR vào khung hình; khi đọc được, nội dung sẽ tự động gửi về biểu mẫu QR Production.</p>
  <video id="video" autoplay muted playsinline></video>
  <div id="status" role="status" aria-live="polite">Đang khởi động camera...</div>
  <button id="stopButton" type="button">DỪNG CAMERA / ĐÓNG CỬA SỔ</button>
</main>
<canvas id="canvas" hidden></canvas>
<script>
(function(){
  const video=document.getElementById('video');
  const canvas=document.getElementById('canvas');
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  const statusBox=document.getElementById('status');
  const stopButton=document.getElementById('stopButton');
  let stream=null, active=false, frameId=null, lastScan=0;
  function status(text,kind){statusBox.textContent=text;statusBox.className=kind||'';}
  function stop(closeWindow){
    active=false;
    if(frameId!==null){cancelAnimationFrame(frameId);frameId=null;}
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
    video.srcObject=null;
    if(closeWindow && window.opener){window.close();}
  }
  stopButton.addEventListener('click',()=>stop(true));
  window.addEventListener('pagehide',()=>stop(false));
  async function start(){
    if(!window.opener){status('Không tìm thấy biểu mẫu đã mở cửa sổ này. Hãy đóng cửa sổ và nhấn QUÉT QR TRỰC TIẾP từ biểu mẫu.','error');return;}
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){status('Trình duyệt không hỗ trợ camera trực tiếp hoặc trang chưa chạy bằng HTTPS.','error');return;}
    if(typeof window.jsQR!=='function'){status('Không tải được thư viện đọc QR. Kiểm tra Internet rồi tải lại trang.','error');return;}
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});
      video.srcObject=stream; await video.play(); active=true;
      status('Camera đã bật. Đưa mã QR vào khung hình.','');
      frameId=requestAnimationFrame(scan);
    }catch(err){
      let msg='Không mở được camera.';
      if(err&&err.name==='NotAllowedError') msg='Quyền camera bị từ chối. Hãy cho phép Camera cho trang quét này trong cài đặt trình duyệt rồi tải lại.';
      else if(err&&err.name==='NotFoundError') msg='Không tìm thấy camera trên thiết bị.';
      else if(err&&err.name==='NotReadableError') msg='Camera đang được ứng dụng khác sử dụng. Hãy đóng ứng dụng đó rồi thử lại.';
      else if(err&&err.message) msg+=' '+err.message;
      status(msg,'error');
    }
  }
  function scan(){
    if(!active)return;
    if(video.readyState>=HTMLMediaElement.HAVE_CURRENT_DATA&&video.videoWidth>0&&video.videoHeight>0&&Date.now()-lastScan>120){
      lastScan=Date.now();
      const scale=Math.min(1,1000/Math.max(video.videoWidth,video.videoHeight));
      canvas.width=Math.max(1,Math.round(video.videoWidth*scale));canvas.height=Math.max(1,Math.round(video.videoHeight*scale));
      ctx.drawImage(video,0,0,canvas.width,canvas.height);
      try{
        const d=ctx.getImageData(0,0,canvas.width,canvas.height);
        const code=window.jsQR(d.data,d.width,d.height,{inversionAttempts:'attemptBoth'});
        if(code&&code.data&&String(code.data).trim()){
          const rawText=String(code.data);
          status('Đọc QR thành công. Đang gửi mã về biểu mẫu...','ok');
          stop(false);
          try{window.opener.postMessage({type:'QR_SCANNED',text:rawText},'*');}catch(e){status('Không gửi được mã về biểu mẫu: '+e.message,'error');return;}
          setTimeout(()=>window.close(),250);
          return;
        }
      }catch(e){}
    }
    frameId=requestAnimationFrame(scan);
  }
  start();
})();
</script>
</body>
</html>
