
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>QR Production - Camera Scanner</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #edf2f7;
      color: #1f2937;
    }

    main {
      max-width: 520px;
      margin: 0 auto;
      padding: 18px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 18px #0001;
    }

    h2 {
      text-align: center;
      color: #124b80;
    }

    video {
      display: block;
      width: 100%;
      max-height: 60vh;
      background: #111827;
      border-radius: 10px;
      object-fit: contain;
    }

    button {
      width: 100%;
      min-height: 48px;
      margin-top: 12px;
      padding: 12px;
      border: 0;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background: #1261a0;
      cursor: pointer;
    }

    #stopButton { background: #b91c1c; }

    #status {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      background: #dbeafe;
      color: #1e40af;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .error {
      background: #fee2e2 !important;
      color: #991b1b !important;
    }

    .ok {
      background: #dcfce7 !important;
      color: #166534 !important;
    }
  </style>
</head>

<body>
<main>
  <h2>QUÉT QR SẢN PHẨM</h2>

  <p>
    Nhấn BẬT CAMERA, cho phép truy cập camera nếu được hỏi,
    rồi đưa mã QR vào giữa khung hình.
  </p>

  <video id="video" autoplay muted playsinline></video>

  <div id="status" role="status" aria-live="polite">
    Nhấn BẬT CAMERA để bắt đầu.
  </div>

  <button id="startButton" type="button">BẬT CAMERA</button>
  <button id="stopButton" type="button">DỪNG CAMERA</button>
</main>

<canvas id="canvas" hidden></canvas>

<script>
(function () {
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const context = canvas.getContext('2d', {
    willReadFrequently: true
  });

  const statusBox = document.getElementById('status');
  const startButton = document.getElementById('startButton');
  const stopButton = document.getElementById('stopButton');

  let stream = null;
  let active = false;
  let starting = false;
  let found = false;
  let frameId = null;
  let lastScan = 0;

  function showStatus(message, type) {
    statusBox.textContent = message;
    statusBox.className = type || '';
  }

  function stopCamera() {
    active = false;

    if (frameId !== null) {
      cancelAnimationFrame(frameId);
      frameId = null;
    }

    if (stream) {
      stream.getTracks().forEach(function (track) {
        track.stop();
      });
      stream = null;
    }

    video.srcObject = null;
    starting = false;
  }

  async function startCamera() {
    if (starting || active) return;

    starting = true;
    found = false;

    if (!window.isSecureContext ||
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      starting = false;
      showStatus(
        'Camera không khả dụng. Hãy mở trang bằng HTTPS và trình duyệt hỗ trợ camera.',
        'error'
      );
      return;
    }

    if (typeof window.jsQR !== 'function') {
      starting = false;
      showStatus(
        'Không tải được thư viện QR. Kiểm tra Internet rồi tải lại trang.',
        'error'
      );
      return;
    }

    showStatus('Đang yêu cầu quyền camera...', '');

    try {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });
      } catch (firstError) {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: true
        });
      }

      video.srcObject = stream;
      await video.play();

      active = true;
      starting = false;

      showStatus(
        'Camera đã bật. Đưa mã QR vào khung hình.',
        ''
      );

      frameId = requestAnimationFrame(scanFrame);

    } catch (err) {
      stopCamera();
      console.error('Camera error:', err.name, err.message);

      let message = 'Không thể mở camera.';

      if (err.name === 'NotAllowedError' ||
          err.name === 'SecurityError') {
        message =
          'Quyền camera bị từ chối. Kiểm tra quyền camera của trình duyệt và quyền riêng tư trên iPhone.';
      } else if (err.name === 'NotFoundError') {
        message = 'Không tìm thấy camera trên thiết bị.';
      } else if (err.name === 'NotReadableError') {
        message =
          'Camera đang bận hoặc không thể khởi động. Hãy đóng ứng dụng khác đang dùng camera.';
      } else {
        message += '\nChi tiết: ' + err.message;
      }

      showStatus(message, 'error');
    }
  }

  function scanFrame() {
    if (!active || found) return;

    if (
      video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA &&
      video.videoWidth > 0 &&
      video.videoHeight > 0 &&
      Date.now() - lastScan >= 150
    ) {
      lastScan = Date.now();

      const scale = Math.min(
        1,
        1000 / Math.max(video.videoWidth, video.videoHeight)
      );

      canvas.width = Math.max(
        1,
        Math.round(video.videoWidth * scale)
      );

      canvas.height = Math.max(
        1,
        Math.round(video.videoHeight * scale)
      );

      context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );

      try {
        const pixels = context.getImageData(
          0,
          0,
          canvas.width,
          canvas.height
        );

        const result = window.jsQR(
          pixels.data,
          pixels.width,
          pixels.height,
          { inversionAttempts: 'attemptBoth' }
        );

        if (result && result.data && result.data.trim()) {
          found = true;

          const qrText = result.data.trim();

          stopCamera();

          if (window.opener && !window.opener.closed) {
            showStatus(
              'Đã quét QR. Đang gửi mã về biểu mẫu...',
              'ok'
            );

           window.opener.postMessage({
  type: 'QR_SCANNED',
  text: qrText
}, 'https://script.google.com');

            setTimeout(function () {
              window.close();
            }, 700);

          } else {
            showStatus(
              'Đã đọc mã QR:\n' + qrText +
              '\n\nKhông có biểu mẫu mở cửa sổ này. Mã chưa được gửi về QR Production.',
              'ok'
            );
          }

          return;
        }
      } catch (err) {
        console.error('QR scan error:', err);
      }
    }

    frameId = requestAnimationFrame(scanFrame);
  }

  startButton.addEventListener('click', startCamera);

  stopButton.addEventListener('click', function () {
    stopCamera();

    showStatus(
      'Camera đã dừng. Nhấn BẬT CAMERA để quét lại.',
      ''
    );
  });

  window.addEventListener('pagehide', stopCamera);
})();
</script>
</body>
</html>
