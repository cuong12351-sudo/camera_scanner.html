
<!DOCTYPE html>
<html lang="vi">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>QR PRODUCTION</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 20px #00000012;
    }

    h2 {
      text-align: center;
      color: #0759a5;
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 16px 0 7px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #93c5fd;
      border-color: #2563eb;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      padding: 13px 8px;
      border: 0;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    #scanBtn, #saveBtn {
      background: #0875d1;
      color: white;
    }

    #clearBtn {
      background: #e2e8f0;
      color: #1e293b;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #eaf2ff;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .ok { background: #dcfce7 !important; color: #166534; }
    .error { background: #fee2e2 !important; color: #991b1b; }
  </style>
</head>

<body>
  <div class="container">
    <h2>QR PRODUCTION</h2>

    <label for="product">Mã số sản phẩm</label>
    <input id="product" type="text" maxlength="200"
           placeholder="Nhập hoặc quét mã QR">

    <button id="scanBtn" type="button" style="width:100%;margin-top:10px">
      QUÉT QR BẰNG CAMERA
    </button>

    <label for="quantity">Số lượng</label>
    <input id="quantity" type="number" min="1" step="1"
           placeholder="Nhập số lượng">

    <label for="line">Chuyền sản xuất</label>
    <input id="line" type="text" placeholder="Nhập chuyền sản xuất">

    <label for="operator">Người thao tác</label>
    <input id="operator" type="text" placeholder="Nhập tên người thao tác">

    <div class="buttons">
      <button id="saveBtn" type="button">LƯU DỮ LIỆU</button>
      <button id="clearBtn" type="button">XÓA NỘI DUNG</button>
    </div>

    <div id="status">Sẵn sàng. Hãy nhập thông tin hoặc quét mã QR.</div>
  </div>

  <script>
    'use strict';

    const SCANNER_URL =
      'https://cuong12351-sudo.github.io/camera_scanner.html/camera_scanner.html';

    const SCANNER_ORIGIN =
      'https://cuong12351-sudo.github.io';

    const productInput = document.getElementById('product');
    const quantityInput = document.getElementById('quantity');
    const lineInput = document.getElementById('line');
    const operatorInput = document.getElementById('operator');

    const scanBtn = document.getElementById('scanBtn');
    const saveBtn = document.getElementById('saveBtn');
    const clearBtn = document.getElementById('clearBtn');
    const statusBox = document.getElementById('status');

    let scannerWindow = null;

    function showStatus(message, type) {
      statusBox.textContent = message;
      statusBox.className = type || '';
    }

    function openScanner() {
      const opened = window.open(
        SCANNER_URL,
        'QRProductionScanner',
        'width=520,height=760'
      );

      if (!opened) {
        showStatus(
          'Trình duyệt đã chặn cửa sổ máy quét. Hãy cho phép cửa sổ bật lên (pop-up), sau đó thử lại.',
          'error'
        );
        return;
      }

      scannerWindow = opened;

      showStatus(
        'Đã mở máy quét QR. Hãy cấp quyền camera và đưa mã QR vào khung hình.',
        ''
      );
    }

    // Nhận mã QR từ cửa sổ GitHub Pages.
    window.addEventListener('message', function(event) {
      // Chỉ chấp nhận tin nhắn từ đúng website máy quét.
      if (event.origin !== SCANNER_ORIGIN) return;

      // Chỉ chấp nhận cửa sổ máy quét do biểu mẫu này mở.
      if (!scannerWindow || event.source !== scannerWindow) return;

      const data = event.data;

      if (!data ||
          data.type !== 'QR_SCANNED' ||
          typeof data.text !== 'string') {
        return;
      }

      const qrText = data.text.trim();

      if (!qrText) {
        showStatus('Mã QR trống. Vui lòng quét lại.', 'error');
        return;
      }

      // Điền mã QR vào trường Mã số sản phẩm.
      productInput.value = qrText.slice(0, 200);
      productInput.dispatchEvent(new Event('input', { bubbles: true }));
      productInput.focus();

      // Xác nhận lại cho cửa sổ máy quét, chỉ sau khi đã điền trường.
      try {
        event.source.postMessage({
          type: 'QR_RECEIVED',
          text: qrText
        }, event.origin);

        showStatus('Đã nhận mã sản phẩm: ' + qrText, 'ok');
      } catch (err) {
        showStatus(
          'Đã điền mã sản phẩm nhưng không gửi được xác nhận: ' +
          err.message,
          'error'
        );
      }

      scannerWindow = null;
    });

    scanBtn.addEventListener('click', openScanner);

    clearBtn.addEventListener('click', function() {
      productInput.value = '';
      quantityInput.value = '';
      lineInput.value = '';
      operatorInput.value = '';

      showStatus('Đã xóa nội dung biểu mẫu.', '');
      productInput.focus();
    });

    saveBtn.addEventListener('click', function() {
      const product = productInput.value.trim();
      const quantity = Number(quantityInput.value);
      const line = lineInput.value.trim();
      const operator = operatorInput.value.trim();

      if (!product) {
        showStatus('Vui lòng nhập hoặc quét Mã số sản phẩm.', 'error');
        productInput.focus();
        return;
      }

      if (!Number.isInteger(quantity) || quantity <= 0) {
        showStatus('Số lượng phải là số nguyên lớn hơn 0.', 'error');
        quantityInput.focus();
        return;
      }

      if (!line) {
        showStatus('Vui lòng nhập Chuyền sản xuất.', 'error');
        lineInput.focus();
        return;
      }

      if (!operator) {
        showStatus('Vui lòng nhập Người thao tác.', 'error');
        operatorInput.focus();
        return;
      }

      const payload = {
        product: product,
        quantity: quantity,
        line: line,
        operator: operator
      };

      if (typeof google === 'undefined' ||
          !google.script ||
          !google.script.run) {
        showStatus(
          'Không tìm thấy kết nối Google Apps Script. Hãy mở biểu mẫu từ URL Web App đã triển khai.',
          'error'
        );
        return;
      }

      saveBtn.disabled = true;
      showStatus('Đang lưu dữ liệu...', '');

      google.script.run
        .withSuccessHandler(function(result) {
          saveBtn.disabled = false;

          // Tương thích với hàm lưu trả về true hoặc object thành công.
          if (result === false ||
              (result && result.success === false)) {
            showStatus(
              (result && result.message) ||
              'Hàm lưu dữ liệu trả về trạng thái thất bại.',
              'error'
            );
            return;
          }

          showStatus(
            (result && result.message) ||
            'Đã gửi yêu cầu lưu dữ liệu thành công.',
            'ok'
          );
        })
        .withFailureHandler(function(error) {
          saveBtn.disabled = false;
          showStatus(
            'Lỗi lưu dữ liệu: ' +
            (error && error.message ? error.message : String(error)),
            'error'
          );
        })
        .saveProduction(payload);
    });
  </script>
</body>
</html>
